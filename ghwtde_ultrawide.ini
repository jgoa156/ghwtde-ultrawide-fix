; GHWT:DE Ultrawide Fix 1.1 settings (all optional; see README - Ultrawide Fix.txt for every key)
[GHWTDE_ULTRAWIDE]
; 3D view keeps 16:9's vertical field of view on wider screens (0 = the game's zoomed-in view)
HorPlus=1
; HUD, menus and text as a centred 16:9 picture
Enabled=1
; loading screens: 0 = 16:9 with black side bars, 1 = fill the width
LoadingFill=0
